<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register Page</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light d-flex align-items-center justify-content-center vh-100">

    <div class="container" style="max-width: 450px;">
        
        <div class="text-center mb-4">
            <img src="logo.png" alt="Logo" style="width: 100px; height: 100px; background-color: white; border-radius: 50%; padding: 10px;">
        </div>

        <div class="card shadow-sm">
            <div class="card-body p-4 p-md-5">
                <h3 class="card-title text-center mb-4" style="font-family:Georgia, 'Times New Roman', Times, serif">Create Account</h3>
                
                <!-- 
                  - Added an id "register-form" to the form.
                  - Removed the 'action' and 'method' attributes.
                -->
                <form id="register-form">
                    
                    <div class="mb-3">
                        <label for="name" class="form-label">Full Name</label>
                        <input id="name" type="text" class="form-control" placeholder="Enter your full name" required />
                    </div>

                    <div class="mb-3">
                        <label for="mail" class="form-label">Email</label>
                        <input id="mail" type="email" class="form-control" placeholder="Enter your email" required />
                    </div>
                    
                    <div class="mb-3">
                        <label for="password" class="form-label" style="font-family: Cambria, Cochin, Georgia, Times, 'Times New Roman', serif;">Password</label>
                        <input id="password" type="password" class="form-control" placeholder="Create a password" required />
                    </div>

                    <div class="mb-4">
                        <label for="confirm-password" class="form-label" style="font-family: Cambria, Cochin, Georgia, Times, 'Times New Roman', serif;">Confirm Password</label>
                        <input id="confirm-password" type="password" class="form-control" placeholder="Confirm your password" required />
                    </div>

                    <!-- This div will show success/error messages -->
                    <div id="message" class="mb-3"></div>

                    <div class="d-grid">
                        <button type="submit" class="btn btn-primary">Register</button>
                    </div>

                </form>
            </div>
        </div>

        <div class="text-center mt-3">
            <p>Already have an account? <a href="login.html">Login</a></p>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <!-- === START JAVASCRIPT FOR FETCH === -->
    <script>
        const registerForm = document.getElementById('register-form');
        const messageDiv = document.getElementById('message');

        registerForm.addEventListener('submit', async (event) => {
            // 1. Prevent default form submission
            event.preventDefault();

            // 2. Get form values
            //    Note: Your backend only expects 'username' and 'password'.
            //    We will use the 'email' as the 'username'.
            //    The 'name' field isn't used by the backend yet, but we could add it later.
            const username = document.getElementById('mail').value;
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirm-password').value;

            // Clear any previous messages
            messageDiv.innerHTML = '';
            messageDiv.className = '';

            // 3. Simple client-side validation
            if (password !== confirmPassword) {
                messageDiv.innerHTML = `<div class="alert alert-danger">Passwords do not match.</div>`;
                return; // Stop the function
            }

            try {
                // 4. Send data to the backend
                const response = await fetch('http://localhost:3001/register', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        username: username, // Sending the email as 'username'
                        password: password
                    })
                });

                // 5. Get the response
                const data = await response.json();

                // 6. Handle the response
                if (response.ok) {
                    // Success!
                    messageDiv.innerHTML = `<div class="alert alert-success">${data.message}</div>`;
                    
                    // Optional: Redirect to the login page after successful registration
                    setTimeout(() => {
                        window.location.href = 'login.html'; // Redirect to login
                    }, 2000); // Wait 2 seconds

                } else {
                    // Error from server (e.g., "Username already taken")
                    messageDiv.innerHTML = `<div class="alert alert-danger">${data.message}</div>`;
                }

            } catch (error) {
                // Network error or server is down
                console.error('Registration Error:', error);
                messageDiv.innerHTML = `<div class="alert alert-danger">Cannot connect to server. Please try again later.</div>`;
            }
        });
    </script>
    <!-- === END JAVASCRIPT FOR FETCH === -->

</body>
</html>
