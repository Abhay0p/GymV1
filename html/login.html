<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Page</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light d-flex align-items-center justify-content-center vh-100">

    <div class="container" style="max-width: 450px;">
        
        <div class="text-center mb-4">
            <img src="logo.png" alt="Logo" style="width: 100px; height: 100px; background-color: white; border-radius: 50%; padding: 10px;">
        </div>

        <div class="card shadow-sm">
            <div class="card-body p-4 p-md-5">
                <h3 class="card-title text-center mb-4" style="font-family:Georgia, 'Times New Roman', Times, serif">Login</h3>
                
                <form id="login-form">
                    
                    <div class="mb-3">
                        <label for="mail" class="form-label">Email</label>
                        <input id="mail" type="email" class="form-control" placeholder="Enter your email" required />
                    </div>
                    
                    <div class="mb-4">
                        <label for="password" class="form-label" style="font-family: Cambria, Cochin, Georgia, Times, 'Times New Roman', serif;">Password</label>
                        <input id="password" type="password" class="form-control" placeholder="Enter your password" required />
                    </div>
                    
                    <!-- This div will show success/error messages -->
                    <div id="message" class="mb-3"></div>

                    <div class="d-grid">
                        <button type="submit" class="btn btn-primary">Login</button>
                    </div>

                </form>
            </div>
        </div>

        <div class="text-center mt-3">
            <p>Don't have an account? <a href="register.html">Sign up</a></p>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <script>
        const loginForm = document.getElementById('login-form');
        const messageDiv = document.getElementById('message');

        loginForm.addEventListener('submit', async (event) => {
            event.preventDefault();

            const username = document.getElementById('mail').value;
            const password = document.getElementById('password').value;
            
            messageDiv.innerHTML = '';
            messageDiv.className = '';

            try {
                const response = await fetch('http://localhost:3001/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        username: username,
                        password: password
                    })
                });

                const data = await response.json();

                if (response.ok) {
                    messageDiv.innerHTML = `<div class="alert alert-success">${data.message}</div>`;
                    
                    // === THIS IS THE MISSING LINE ===
                    // Save the username that the server sent back
                    sessionStorage.setItem('username', data.username); 
                    // =================================
                    
                    setTimeout(() => {
                        window.location.href = 'index.html';
                    }, 1500);

                } else {
                    messageDiv.innerHTML = `<div class="alert alert-danger">${data.message}</div>`;
                }

            } catch (error) {
                console.error('Login Error:', error);
                messageDiv.innerHTML = `<div class="alert alert-danger">Cannot connect to server. Please try again later.</div>`;
            }
        });
    </script>
</body>
</html>
